services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
    - 6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      ARTICLE_IMAGE_DIR: /app/article-images
    ports:
    - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - article_images:/app/article-images
  worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command:
    - python
    - -m
    - app.worker
    volumes:
    - ../../knowledge:/app/knowledge
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY}
      WORDPRESS_URL: ${WORDPRESS_URL}
      WORDPRESS_USERNAME: ${WORDPRESS_USERNAME}
      WORDPRESS_APP_PASSWORD: ${WORDPRESS_APP_PASSWORD}
      WORDPRESS_TIMEOUT: ${WORDPRESS_TIMEOUT:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    command:
    - npm
    - run
    - dev
    - --
    - --hostname
    - 0.0.0.0
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
    - 3001:3000
    depends_on:
    - api
  image-worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command:
    - python
    - -m
    - app.image_worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ARTICLE_IMAGE_DIR: /app/article-images
      AIHORDE_API_KEY: ${AIHORDE_API_KEY:-0000000000}
    volumes:
    - article_images:/app/article-images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data: null
  article_images: null
